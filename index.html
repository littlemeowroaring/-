<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First Website</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            max-width: 700px;
            margin: 80px auto;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            font-size: 42px;
        }

        p {
            font-size: 20px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Hello, I'm H.</h1>

    <p>
        Welcome to my first website.
    </p>

    <button onclick="sayHello()">
        Click me
    </button>

    <script>
        function sayHello() {
            alert("Hello from my website!");
        }
    </script>

</body>
</html>
